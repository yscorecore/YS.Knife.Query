name: build
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['6.0', '8.0', '9.0', '10.0', '11.0']
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5
    - name: Setup .NET Core ${{ matrix.dotnet-version }}
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
    - name: Restore Dotnet Tool
      run: dotnet tool restore
    - name: Check Code Format
      run: dotnet format --verify-no-changes
    - name: Build with dotnet
      run: dotnet build -f net${{ matrix.dotnet-version }}.0
    - name: Run Unit test
      run: dotnet test -f net${{ matrix.dotnet-version }}.0 --no-restore
